cat > /home/claude/admin-login.html << 'ENDOFFILE'
<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Armood — Admin Giriş</title>
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
:root{--gold:#C9A84C;--gold-light:#E8C97A;--dark:#0F0D0A;--dark2:#1A1712;--dark3:#252118;--cream:#F7F2E8;--muted:rgba(247,242,232,0.5);--ff-head:'Georgia',serif;--ff-body:system-ui,sans-serif;}
body{background:var(--dark);color:var(--cream);font-family:var(--ff-body);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.5rem;}
.login-card{background:var(--dark2);border:1px solid rgba(201,168,76,0.2);padding:2.5rem;width:100%;max-width:400px;}
.login-logo{font-family:var(--ff-head);font-size:1.8rem;color:var(--gold);letter-spacing:0.08em;text-align:center;margin-bottom:0.3rem;}
.login-subtitle{text-align:center;font-size:0.75rem;letter-spacing:0.2em;text-transform:uppercase;color:var(--muted);margin-bottom:2rem;}
.form-group{display:flex;flex-direction:column;gap:0.35rem;margin-bottom:1rem;}
.form-group label{font-size:0.68rem;letter-spacing:0.18em;text-transform:uppercase;color:rgba(247,242,232,0.4);}
.form-group input{background:var(--dark);border:1px solid rgba(201,168,76,0.15);color:var(--cream);padding:0.75rem 0.9rem;font-family:var(--ff-body);font-size:0.9rem;outline:none;transition:border-color 0.2s;border-radius:2px;-webkit-appearance:none;}
.form-group input:focus{border-color:var(--gold);}
.btn-login{width:100%;background:var(--gold);color:var(--dark);border:none;cursor:pointer;font-family:var(--ff-body);font-size:0.82rem;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;padding:0.9rem;transition:background 0.2s;margin-top:0.5rem;border-radius:2px;}
.btn-login:hover{background:var(--gold-light);}
.btn-login:disabled{opacity:0.5;cursor:not-allowed;}
.error-msg{background:rgba(224,92,92,0.1);border:1px solid rgba(224,92,92,0.3);color:#f87171;padding:0.7rem 0.9rem;font-size:0.82rem;margin-bottom:1rem;display:none;border-radius:2px;}
.error-msg.show{display:block;}
</style>
</head>
<body>
<div class="login-card">
  <div class="login-logo">ARMOOD</div>
  <div class="login-subtitle">Admin Panel</div>
  <div class="error-msg" id="errorMsg">Email və ya şifrə yanlışdır.</div>
  <div class="form-group">
    <label>Email</label>
    <input type="email" id="email" placeholder="admin@armood.az" autocomplete="email">
  </div>
  <div class="form-group">
    <label>Şifrə</label>
    <input type="password" id="password" placeholder="••••••••" autocomplete="current-password">
  </div>
  <button class="btn-login" id="btnLogin">Daxil Ol →</button>
</div>

<script>
const SUPABASE_URL = 'https://kkncvrstqoqtsxzdhxdh.supabase.co';
const SUPABASE_ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtrbmN2cnN0cW9xdHN4emRoeGRoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAxNTY2ODcsImV4cCI6MjA5NTczMjY4N30.ZRYtZpz5KAmn5Z4h5trryqzhvJZ6LVff6r5Bk21VBXg';

// If already logged in, redirect
const session = localStorage.getItem('armood_session');
if (session) window.location.href = 'admin.html';

document.getElementById('btnLogin').addEventListener('click', login);
document.getElementById('password').addEventListener('keydown', e => { if(e.key==='Enter') login(); });

async function login() {
  const email = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('btnLogin');
  const err = document.getElementById('errorMsg');

  if (!email || !password) { err.textContent='Email və şifrəni daxil edin.'; err.classList.add('show'); return; }

  btn.disabled = true;
  btn.textContent = 'Yüklənir...';
  err.classList.remove('show');

  try {
    const res = await fetch(`${SUPABASE_URL}/auth/v1/token?grant_type=password`, {
      method:'POST',
      headers:{'apikey':SUPABASE_ANON,'Content-Type':'application/json'},
      body: JSON.stringify({email, password})
    });
    const data = await res.json();

    if (data.error || !data.access_token) {
      err.textContent = 'Email və ya şifrə yanlışdır.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Daxil Ol →';
      return;
    }

    // Check if user is in admins table
    const adminRes = await fetch(`${SUPABASE_URL}/rest/v1/admins?email=eq.${email}&select=*`, {
      headers:{'apikey':SUPABASE_ANON,'Authorization':`Bearer ${data.access_token}`}
    });
    const adminData = await adminRes.json();

    if (!adminData.length) {
      err.textContent = 'Bu hesab admin deyil.';
      err.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Daxil Ol →';
      return;
    }

    // Save session
    localStorage.setItem('armood_session', JSON.stringify({
      token: data.access_token,
      user: adminData[0]
    }));

    window.location.href = 'admin.html';
  } catch(e) {
    err.textContent = 'Xəta baş verdi. Yenidən cəhd edin.';
    err.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Daxil Ol →';
  }
}
</script>
</body>
</html>
ENDOFFILE
echo "Done"
